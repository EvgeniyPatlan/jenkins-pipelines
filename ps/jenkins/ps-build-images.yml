- job:
    name: ps-build-images
    project-type: pipeline
    description: |
        Do not edit this job through the web!
        Builds the prepared Percona Server build images (perconalab/ps-build) from pinned base images,
        and prints the PREPARED_IMAGES map for the percona-server-for-mysql-* pipelines.
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/jenkins-pipelines.git
            branches:
            - master
            wipe-workspace: false
      lightweight-checkout: true
      script-path: ps/jenkins/ps-build-images.groovy
    triggers:
      - timed: "H 3 * * 0"
