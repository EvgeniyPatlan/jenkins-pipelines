- job:
    name: test-ps9.0-RELEASE
    project-type: pipeline
    description: |
        Test copy of ps9.0-RELEASE for the build hardening branches. Runs ps/jenkins/percona-server-for-mysql-9.0.groovy
        from https://github.com/EvgeniyPatlan/jenkins-pipelines.git (test-build-hardening) with TEST_MODE on: builds and verifies packages, stashes them
        under s3://percona-jenkins-artifactory/test-sec-build-hardening/, and never signs, uploads to repo.ci,
        syncs, pushes images or notifies. Delete when the branches are merged.
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/EvgeniyPatlan/jenkins-pipelines.git
            branches:
            - 'test-build-hardening'
            wipe-workspace: false
      lightweight-checkout: true
      script-path: ps/jenkins/percona-server-for-mysql-9.0.groovy
